# ========================================
# Smart Factory IoT Backend - CI/CD Pipeline
# ========================================
# This workflow automates the following:
# 1. Continuous Integration (CI):
#    - Restores dependencies
#    - Builds the solution
#    - Runs unit and integration tests
# 2. Continuous Deployment (CD):
#    - Builds deployment artifacts for Vercel
#    - Deploys production release to Vercel Hosting
# ========================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: imsop-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------
  # Job 1: Build and Test
  # ----------------------------------------
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04
    # Match the locked Playwright package; browsers and system libraries are preinstalled.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Restore Dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build Solution
        env:
          VITE_BASE_PATH: /
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate

      - name: Run Tests
        run: pnpm test

      - name: Verify Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run End-to-End Tests
        env:
          VITE_BASE_PATH: /
        run: pnpm e2e

  # ----------------------------------------
  # Job 2: Vercel Deploy
  # ----------------------------------------
  vercel-deploy:
    name: Vercel Deploy
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Vercel credentials
        id: vercel
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Vercel credentials are missing; production deployment was not performed."
            exit 1
          fi

      - name: Verify the required backend release before publishing
        run: |
          backend_sha="$(git ls-remote https://github.com/DruHustle/imsop-app-backend.git refs/heads/main | cut -f1)"
          node scripts/verify-live-release.mjs --api-only https://imsop-api.152-70-22-84.sslip.io "$backend_sha"
          echo "IMSOP_BACKEND_REVISION=$backend_sha" >> "$GITHUB_ENV"

      - name: Pull Vercel Environment Information
        if: steps.vercel.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Project Artifacts
        if: steps.vercel.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_BASE_PATH: /
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Project Artifacts to Vercel
        if: steps.vercel.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Verify the published source and first-party API
        run: node scripts/verify-live-release.mjs https://imsop-app.vercel.app "${{ github.sha }}" "$IMSOP_BACKEND_REVISION"
