name: Paired frontend and backend qualification
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-browser-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout frontend candidate
        uses: actions/checkout@v4
        with:
          path: imsop-app-frontend
      - name: Checkout the compatible backend
        uses: actions/checkout@v4
        with:
          repository: DruHustle/imsop-app-backend
          ref: main
          path: imsop-app-backend
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            imsop-app-frontend/pnpm-lock.yaml
            imsop-app-backend/server/pnpm-lock.yaml
      - name: Install both locked source trees
        run: |
          pnpm -C imsop-app-frontend install --frozen-lockfile
          pnpm -C imsop-app-backend/server install --frozen-lockfile
      - name: Build the exact backend source
        run: |
          backend_sha="$(git -C imsop-app-backend rev-parse HEAD)"
          echo "Paired source: frontend=$GITHUB_SHA backend=$backend_sha"
          docker build --build-arg APP_REVISION="$backend_sha" -f imsop-app-backend/deploy/oracle/Dockerfile -t imsop-remediation:qualification imsop-app-backend
      - name: Start only the disposable qualification stack
        working-directory: imsop-app-backend
        run: docker compose -f server/system/compose.yaml up -d --wait
      - name: Verify the real gateway and prepare isolated browser identities
        working-directory: imsop-app-backend/server
        env:
          DATABASE_URL: postgresql://imsop_test:isolated-test-only@127.0.0.1:55467/imsop_test
          NODE_ENV: test
        run: |
          pnpm exec node --test --import tsx system/gateway.test.ts
          pnpm exec tsx system/scale-fixture.ts
      - name: Reset the isolated process limiter before browser qualification
        working-directory: imsop-app-backend
        run: |
          docker compose -f server/system/compose.yaml restart backend
          docker compose -f server/system/compose.yaml up -d --wait
      - name: Install Chromium and system libraries
        working-directory: imsop-app-frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Real recovery, scoped reads, reviews, purchasing, receipts, mail and forecasts
        working-directory: imsop-app-frontend
        run: pnpm exec playwright test --config playwright.system.config.ts
      - name: Stop only the disposable qualification stack
        if: always()
        working-directory: imsop-app-backend
        run: docker compose -f server/system/compose.yaml down -v
