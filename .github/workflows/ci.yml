name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # Match the locked Playwright package; browsers and system libraries are preinstalled.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate

      - name: Verify Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run desktop and mobile end-to-end tests
        env:
          VITE_BASE_PATH: /
        run: pnpm e2e

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        env:
          VITE_API_URL: https://imsop-api.152-70-22-84.sslip.io
          VITE_BASE_PATH: /imsop-app-frontend/
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the required backend before publishing Pages
        run: |
          backend_sha="$(git ls-remote https://github.com/DruHustle/imsop-app-backend.git refs/heads/main | cut -f1)"
          node scripts/verify-live-release.mjs --api-only https://imsop-api.152-70-22-84.sslip.io "$backend_sha"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Rollback on Failure
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "Deployment failed. Rolling back to the last successful deployment..."
          # Note: GitHub Pages automatically keeps the last successful deployment active if the new one fails.
          # This step serves as an explicit notification and can be expanded for custom hosting.
          exit 1
